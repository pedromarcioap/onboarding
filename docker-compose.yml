version: '3.8'

services:
  izy-onboarding-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: izy-onboarding-web
    restart: unless-stopped
    ports:
      - "3005:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
